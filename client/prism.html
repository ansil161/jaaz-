<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <!-- The brand mark, replacing the template lightning bolt that
         shipped with the scaffold. An opaque black tile rather than a
         transparent glyph: the lockup's inks are dark, so a
         transparent favicon disappears into every dark tab strip. The
         tile carries the logotype alone — BRIO and the tagline are
         unreadable at 16px. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/jaz-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/jaz-apple-touch.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>JAAZ — Private Home Entertainment</title>
    <meta
      name="description"
      content="JAAZ designs private cinemas and luxury home entertainment spaces where picture, sound and seating are engineered around one idea: comfort."
    />
    <!-- Social card: the full lockup on the brand's own black. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JAAZ — Private Home Entertainment" />
    <meta
      property="og:description"
      content="JAAZ designs private cinemas and luxury home entertainment spaces where picture, sound and seating are engineered around one idea: comfort."
    />
    <meta property="og:image" content="/jaz-og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/jaz-og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      /prism.html?reduced=1 forces the reduced-motion branch.

      Two reasons this lives here rather than in the module. It has to
      run BEFORE any module evaluates, because `prefersReducedMotion()`
      is read during the component's first layout effect. And it is the
      only way to QA a pinned section through the browser MCP at all:
      screenshotting puts the tab at `visibilityState: hidden`, which
      stops rAF, which stops GSAP's ticker, which strands every scrubbed
      timeline. The reduced-motion branch needs no ticker, so it is the
      one path that screenshots honestly — and because <Prism> is a
      composition rather than a sequence, that branch shows the whole
      section rather than a degraded version of it.

      Dev-only — this file is not among the build inputs in
      vite.config.js and never ships.
    -->
    <script>
      if (new URLSearchParams(location.search).has('reduced')) {
        const real = window.matchMedia.bind(window)
        window.matchMedia = (q) =>
          q.includes('prefers-reduced-motion')
            ? { matches: true, media: q, addEventListener() {}, removeEventListener() {}, addListener() {}, removeListener() {} }
            : real(q)
      }
    </script>
    <script type="module" src="/src/app/public/prism-preview.jsx"></script>
  </body>
</html>
